# Include inside the existing authenticated dsh server block. The server's
# auth_request/PAM protection must apply to this path and its WebSocket upgrade.
location ^~ /subscription-browser/ {
    proxy_pass http://127.0.0.1:16080/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
